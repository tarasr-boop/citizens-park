name: Probe (temporary)

# A one-off check that the Pages actions named in daily.yml exist at those
# versions. This file is removed before the pull request is ready.

on:
  push:
    branches: ["claude/first-build"]
    paths:
      - ".github/workflows/probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Check the Pages actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the code
        uses: actions/checkout@v7
      - name: Build the page offline
        run: python3 -m parkbot run --post never --offline --data "$RUNNER_TEMP/data" --site site
      - name: Package the page
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # Never runs here. It is only named so that GitHub fetches the action and
      # shows whether this version exists.
      - name: Publish (skipped)
        if: ${{ false }}
        uses: actions/deploy-pages@v5

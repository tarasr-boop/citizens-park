name: Probe (temporary)

# A one-off look at how GitHub's runners reach the weather services.
# This file is removed again before the pull request is ready.

on:
  push:
    branches: ["claude/first-build"]
    paths:
      - ".github/workflows/probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Reach the weather services
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FORECAST: "https://api.open-meteo.com/v1/forecast?latitude=-37.8146&longitude=144.9990&hourly=precipitation_probability%2Cprecipitation&daily=precipitation_probability_max%2Cprecipitation_sum&timezone=Australia%2FMelbourne&forecast_days=8"
      TIMING: "code=%{http_code} ip=%{remote_ip} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n"
    steps:
      - name: Versions and addresses
        run: |
          python3 --version
          openssl version
          curl --version | head -1
          getent ahosts api.open-meteo.com || true
          getent ahosts api.met.no || true

      - name: Open-Meteo with curl, three tries
        run: |
          for try in 1 2 3; do
            curl -sS -m 30 -o /tmp/om.json -w "try $try: $TIMING" "$FORECAST" || true
            sleep 4
          done
          echo "--- start of the reply ---"
          head -c 500 /tmp/om.json || true
          echo

      - name: Open-Meteo with curl, IPv4 and a small TLS hello
        run: |
          curl -4 -sS -m 30 -o /dev/null -w "ipv4: $TIMING" "$FORECAST" || true
          curl -sS -m 30 --curves X25519 -o /dev/null -w "x25519 only: $TIMING" "$FORECAST" || true
          curl -sS -m 30 --tls-max 1.2 -o /dev/null -w "tls 1.2: $TIMING" "$FORECAST" || true
          curl -sS -m 30 --http1.1 -o /dev/null -w "http 1.1: $TIMING" "$FORECAST" || true

      - name: Open-Meteo with Python, as the checker does it
        run: |
          python3 - <<'PY'
          import os, ssl, time, urllib.request

          url = os.environ["FORECAST"]
          print("OpenSSL:", ssl.OPENSSL_VERSION)
          for label, headers in (
              ("checker headers", {"User-Agent": "Mozilla/5.0 (compatible; CitizensParkAlerts/1.0; community dog-walker notice)", "Accept": "application/json", "Accept-Encoding": "gzip", "Accept-Language": "en-AU,en;q=0.8"}),
              ("plain headers", {"User-Agent": "CitizensParkAlerts/1.0"}),
          ):
              started = time.monotonic()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as reply:
                      body = reply.read()
                  print(f"{label}: status {reply.status}, {len(body)} bytes, {time.monotonic() - started:.1f}s")
              except Exception as error:  # noqa: BLE001
                  print(f"{label}: FAILED after {time.monotonic() - started:.1f}s: {type(error).__name__}: {error}")
          PY

      - name: MET Norway
        run: |
          curl -sS -m 30 -A "CitizensParkAlerts/1.0 (community park notice)" -o /tmp/met.json \
            -w "met.no complete: $TIMING" "https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=-37.8146&lon=144.9990" || true
          python3 - <<'PY'
          import json

          try:
              data = json.load(open("/tmp/met.json", encoding="utf-8"))
              series = data["properties"]["timeseries"]
              print("updated:", data["properties"]["meta"].get("updated_at"), "points:", len(series))
              print("first:", series[0]["time"], json.dumps(series[0]["data"].get("next_1_hours"))[:400])
              print("hourly points:", sum(1 for point in series if "next_1_hours" in point["data"]))
              print("with a chance of rain:", sum(1 for point in series if "probability_of_precipitation" in point["data"].get("next_1_hours", {}).get("details", {})))
              later = [point for point in series if "next_1_hours" not in point["data"]]
              if later:
                  print("first six-hourly:", later[0]["time"], json.dumps(later[0]["data"].get("next_6_hours"))[:400])
              print("last:", series[-1]["time"])
          except Exception as error:  # noqa: BLE001
              print("could not read the reply:", type(error).__name__, error)
              print(open("/tmp/met.json", encoding="utf-8", errors="replace").read()[:500])
          PY

      - name: Telegram and the council
        run: |
          curl -sS -m 20 -o /dev/null -w "telegram: $TIMING" "https://api.telegram.org/" || true
          curl -sS -m 30 -o /dev/null -A "Mozilla/5.0 (compatible; CitizensParkAlerts/1.0; community dog-walker notice)" \
            -w "council: $TIMING" "https://www.yarracity.vic.gov.au/things-to-do/parks-reserves-and-playgrounds/citizens-park" || true

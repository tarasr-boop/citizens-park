name: Alerts backend

# Puts the alerts backend (the notifications/ folder) on Cloudflare. That is
# the small program that keeps the devices that asked for the daily alert and
# sends it to them.
#
# It runs when that folder changes on the main branch, and when it is started
# by hand (Actions, "Alerts backend", "Run workflow"). To deploy, it needs two
# secrets in this repository's settings: CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. The README says how to make them. Until both are
# there, the backend is only tested, and the run says so.
#
# A third secret, DAILY_CHECK_TOKEN, is optional. With it the backend also
# starts the daily check when GitHub's own timer has not ("the second timer").
# After adding or changing it, start this workflow by hand once.
#
# The Telegram bot's token, TELEGRAM_BOT_TOKEN, is the one the daily check
# posts to the channel with. This workflow hands it to the backend too, which
# then runs the bot's custom alerts. After changing it, start this workflow by
# hand once.

on:
  push:
    branches: [main]
    paths:
      - "notifications/**"
      - ".github/workflows/alerts.yml"
  workflow_dispatch:

# No rights for the workflow as a whole. Each job below is given only the ones it needs.
permissions: {}

# One deployment at a time.
concurrency:
  group: alerts-backend
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: notifications
    steps:
      - name: Get the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Get Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      # Exactly the versions listed in package-lock.json, and without running
      # any of the scripts that packages bring along.
      - name: Install the tools
        run: npm ci --ignore-scripts
      - name: Run the tests
        run: npm test
      # Bundles the code the way a deploy does, then runs that bundle in the
      # same program that runs it on Cloudflare's servers.
      - name: Try it in Cloudflare's own runtime
        run: npm run runtime

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: notifications
    steps:
      - name: Get the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only "true" or "false" reaches this step, never the secrets themselves.
      - name: Look for the secrets
        id: secrets
        env:
          BOTH_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          TIMER_SET: ${{ secrets.DAILY_CHECK_TOKEN != '' }}
          BOT_SET: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          if [ "$BOTH_SET" != "true" ]; then
            echo "found=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Tested but not deployed::The secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set, so nothing was put on Cloudflare."
            echo "The backend passed its tests. It was not deployed, because the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set. The README says how to make them." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "found=yes" >> "$GITHUB_OUTPUT"
          if [ "$TIMER_SET" = "true" ]; then
            echo "timer=yes" >> "$GITHUB_OUTPUT"
          else
            echo "timer=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Second timer is off::The secret DAILY_CHECK_TOKEN is not set, so the backend does not start the daily check when GitHub's own timer misses it. The README says how to make the token."
          fi
          if [ "$BOT_SET" = "true" ]; then
            echo "bot=yes" >> "$GITHUB_OUTPUT"
          else
            echo "bot=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Telegram bot is off::The secret TELEGRAM_BOT_TOKEN is not set, so the backend does not run the bot's custom alerts."
          fi

      - name: Get Node
        if: steps.secrets.outputs.found == 'yes'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      # Only the deploy tool and what it needs, in exactly the versions listed
      # in package-lock.json, and without running any install scripts.
      - name: Install the deploy tool
        if: steps.secrets.outputs.found == 'yes'
        run: npm ci --omit=dev --ignore-scripts

      # The one step that is handed the secrets.
      - name: Deploy to Cloudflare
        if: steps.secrets.outputs.found == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --no-install wrangler deploy

      # The token for the second timer goes from GitHub's secret straight into
      # the deploy tool, which hands it to Cloudflare to keep as a secret of
      # the backend. It is not written to a file or to this log on the way.
      - name: Hand the second timer its token
        if: steps.secrets.outputs.found == 'yes' && steps.secrets.outputs.timer == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DAILY_CHECK_TOKEN: ${{ secrets.DAILY_CHECK_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: printf '%s' "$DAILY_CHECK_TOKEN" | npx --no-install wrangler secret put DAILY_CHECK_TOKEN

      # The same for the Telegram bot's token, which the backend needs to run
      # the bot's custom alerts. Straight from GitHub's secret into the deploy
      # tool, with nothing written to a file or to this log on the way.
      - name: Hand the bot its token
        if: steps.secrets.outputs.found == 'yes' && steps.secrets.outputs.bot == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --no-install wrangler secret put TELEGRAM_BOT_TOKEN

      # The address comes from wrangler.jsonc. The first time, Cloudflare needs
      # a few minutes to set it up, so this asks patiently.
      - name: Ask the backend how things are
        if: steps.secrets.outputs.found == 'yes'
        env:
          TIMER: ${{ steps.secrets.outputs.timer }}
          BOT: ${{ steps.secrets.outputs.bot }}
        run: |
          host="$(sed -n 's/.*"pattern": *"\([a-z0-9.-]*\)".*/\1/p' wrangler.jsonc | head -n 1)"
          if [ -z "$host" ]; then
            echo "::error::No address was found in wrangler.jsonc."
            exit 1
          fi
          # While CHECK_TIMES is empty, the second timer is off on purpose.
          if grep -q '"CHECK_TIMES": *""' wrangler.jsonc; then
            TIMER=no
          fi
          answered=no
          for attempt in $(seq 1 24); do
            if answer="$(curl --silent --show-error --fail --max-time 10 "https://$host/status")"; then
              answered=yes
              # With their tokens handed over, the backend must say that its second timer and its bot are on.
              if { [ "$TIMER" != "yes" ] || printf '%s' "$answer" | grep -q '"starter":{"on":true'; } &&
                { [ "$BOT" != "yes" ] || printf '%s' "$answer" | grep -q '"telegram":{"on":true'; }; then
                echo "The backend answers at https://$host/status:"
                # Shown in this log only. It is never written anywhere that formats text.
                printf '%s\n' "$answer" | head -c 2000 | tr -d '\r' | sed 's/^/  /'
                echo "The alerts backend is live at https://$host" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "The backend answers, but its second timer or its bot is not on yet (try $attempt of 24)."
            else
              echo "No answer yet (try $attempt of 24). A new address can take a few minutes to start working."
            fi
            sleep 15
          done
          if [ "$answered" = "yes" ]; then
            echo "::error title=Second timer or bot did not switch on::The tokens were handed to Cloudflare, but https://$host/status still says that the second timer or the bot is off."
          else
            echo "::error title=Deployed but not answering yet::https://$host/status gave no answer for several minutes. Run this workflow again in a quarter of an hour."
          fi
          exit 1

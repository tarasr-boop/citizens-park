name: Timer probe, Melbourne time (temporary)

# A temporary test, to find out why GitHub's timer has not started the Daily
# check. This one is written the way the Daily check's timer is, with a time
# zone: every ten minutes from 6 PM to midnight, Melbourne time. If the time
# zone were not understood, it would run from 5 AM to 11 AM instead. It only
# says the time, and it is removed once the answer is known.

on:
  schedule:
    - cron: "*/10 18-23 * * *"
      timezone: "Australia/Melbourne"
  workflow_dispatch:

# No rights at all: it reads nothing and changes nothing.
permissions: {}

jobs:
  say:
    name: Say the time
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Say the time
        run: TZ=Australia/Melbourne date "+%Y-%m-%d %H:%M in Melbourne"

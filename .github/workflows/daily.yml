name: Daily check

# Reads the council's page and the rain forecast, posts to the Telegram channel
# once a day, and rebuilds the public page.

on:
  schedule:
    # These times are Melbourne time. Extra runs do no harm: the script posts
    # once a day, on the first run inside the window set in config.toml
    # (from 2:30 PM). GitHub often starts scheduled runs 10 to 30 minutes late,
    # which is why the post run is set for 2:40 PM and has two backups.
    - cron: "17 6 * * *"
      timezone: "Australia/Melbourne"
    - cron: "47 11 * * *"
      timezone: "Australia/Melbourne"
    # Shortly before the post, so that a recent forecast is saved in case the
    # weather service does not answer the post run.
    - cron: "47 13 * * *"
      timezone: "Australia/Melbourne"
    - cron: "40 14 * * *"
      timezone: "Australia/Melbourne"
    - cron: "10 15 * * *"
      timezone: "Australia/Melbourne"
    - cron: "45 15 * * *"
      timezone: "Australia/Melbourne"
    # A safety net in plain UTC, in case the time zone setting above ever
    # fails: 3:55 PM during daylight saving time, 2:55 PM in winter.
    - cron: "55 4 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "tests/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      post:
        description: "Telegram post. auto: only if it is due. force: post now. never: just rebuild the page."
        type: choice
        default: auto
        options:
          - auto
          - force
          - never
      show_sources:
        description: "Print the raw council table in the log (to diagnose a failed read)"
        type: boolean
        default: false

permissions:
  contents: write # save data/ back to the repository
  pages: write # publish the page
  id-token: write # needed by GitHub Pages
  issues: write # the watchdog opens an issue when a source keeps failing

# One run at a time, so two runs can never both decide to post.
concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    name: Check, post and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      page: ${{ steps.check.outputs.page }}
    steps:
      # Without "ref", a run gets the copy of the repository from the moment it
      # was asked for. A run that then waited for an earlier run to finish would
      # miss what that run saved in data/, and could post a second time. With
      # "ref", it gets the newest copy of the branch at the moment it starts.
      - name: Get the code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Run the check
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          POST_MODE: ${{ inputs.post || 'auto' }}
          SHOW_SOURCES: ${{ inputs.show_sources && '--show-sources' || '' }}
        run: python3 -m parkbot run --post "$POST_MODE" $SHOW_SOURCES

      - name: Save what was learned
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit --quiet -m "Update data"
          for attempt in 1 2 3 4; do
            if git push --quiet; then
              echo "Saved."
              exit 0
            fi
            sleep $((attempt * 5))
            git pull --quiet --rebase
          done
          echo "::error::Could not save data/ back to the repository, so the next run may post again."
          exit 1

      - name: Package the page
        if: ${{ !cancelled() && steps.check.outputs.page == 'ready' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Runs whenever a page was built, even if a later step of the check failed.
  publish:
    name: Publish the page
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.page == 'ready' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

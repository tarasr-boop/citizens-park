name: Tests

# Runs on every change to the code. Nothing here posts to Telegram or
# publishes the page.

on:
  push:
    paths-ignore:
      - "data/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v7
      - name: Run the tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Check the page's script
        run: node --check parkbot/web/page.js

  # The alerts backend (the notifications/ folder): the Telegram bot, the
  # second timer and the visit counter. Nothing here is put on Cloudflare:
  # that is the job of the "Alerts backend" workflow.
  alerts:
    name: Alerts backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: notifications
    steps:
      - name: Get the code
        uses: actions/checkout@v7
      - name: Get Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      # Exactly the versions listed in package-lock.json, and without running
      # any of the scripts that packages bring along.
      - name: Install the tools
        run: npm ci --ignore-scripts
      - name: Run the tests
        run: npm test
      # Bundles the code the way a deploy does, then runs that bundle in the
      # same program that runs it on Cloudflare's servers.
      - name: Try it in Cloudflare's own runtime
        run: npm run runtime

  dry-run:
    name: Dry run with the live sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v7
      # Reads the real council page and forecast and builds the page in a
      # scratch folder. It posts nothing and saves nothing.
      - name: Read the live sources
        run: python3 -m parkbot run --post never --show-sources --data "$RUNNER_TEMP/data" --site "$RUNNER_TEMP/site"
      # The run above takes the usual route to the weather service. This asks
      # each of the service's servers by its address, which is the detour a run
      # takes when the usual route gets no answer. Taking it here on purpose
      # means a change that breaks it is found now, and not on the first bad day.
      - name: Try the detour to the weather service
        run: python3 -m parkbot routes
      - name: Show what was read
        if: ${{ !cancelled() }}
        run: |
          echo "----- council.json (start) -----"
          head -c 1500 "$RUNNER_TEMP/data/council.json" || true
          echo
          echo "----- data.json (start) -----"
          head -c 1500 "$RUNNER_TEMP/site/data.json" || true

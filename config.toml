# Settings for the Citizens Park alerts.
# Edit this file on GitHub (pencil icon), then press "Commit changes".
# The page rebuilds by itself a minute or two later.

[park]
name = "Citizens Park oval"
short_name = "Citizens Park"
suburb = "Richmond"
latitude = -37.8146
longitude = 144.9990
timezone = "Australia/Melbourne"
# The timeline on the page runs from day_start to day_end.
day_start = "07:00"
day_end = "21:00"
# The council keeps the oval lights on until 10 PM.
lights_off = "22:00"

[council]
url = "https://www.yarracity.vic.gov.au/things-to-do/parks-reserves-and-playgrounds/citizens-park"
# How the checker introduces itself to the council's website.
user_agent = "Mozilla/5.0 (compatible; CitizensParkAlerts/1.0; community dog-walker notice)"

[telegram]
# The public channel's link name: the part after "t.me/".
# While this is empty nothing is posted, and the page leaves out its Telegram button.
channel = "CitizensBark"
# The channel has moved to the bot (see [bot]). With this set to true, the next
# daily check posts once in the channel to say where the alerts are now, and
# after that the channel gets nothing more. The page leaves the channel out.
retired = true
# On a rainy day the post names the best time to stay out of the rain. It looks
# between these two times, and only at times when the oval is not booked.
advice_from = "17:00"
advice_until = "21:00"

[alerts]
# When the daily alert goes out, in Melbourne time: the post in the Telegram
# channel (now retired). One time for Monday to Friday and one for Saturday and
# Sunday. The daily check runs a little before each of these times.
# If you change them, change the run times in .github/workflows/daily.yml and
# CHECK_TIMES in notifications/wrangler.jsonc too. The tests say what to change.
weekdays = "16:00"
weekends = "08:00"
# An alert that could not go out by this time is left out for the day.
until = "19:00"

[bot]
# Custom alerts from the Telegram bot (the same bot that posted to the channel).
# The bot's link name: the part after "t.me/". While it is empty, the page's
# Telegram button leads to the channel instead.
name = "CitizensParkDogsBot"
# Each person picks one time for weekdays and one for weekends, on the hour,
# from "first" to "last". A new chat starts with "weekday" and "weekend".
# An alert at "evening" or later is about the next day, sent the evening before.
# If you change these, change the BOT_ settings in notifications/wrangler.jsonc
# too. The tests say so if they no longer agree.
first = "04:00"
last = "23:00"
evening = "21:00"
weekday = "16:00"
weekend = "08:00"

[site]
# A name for the page itself, for example "Citizens Bark". It appears at the top
# of the page and under the home-screen icon. Leave it empty to use the park's name.
name = "Citizens Bark"
# The public address of the page. The QR code points here, so if this ever
# changes, the QR code must be made again (see the README).
url = "https://citizensbark.com/"
# Paste your Ko-fi link here to show a tip button, for example "https://ko-fi.com/yourname".
# Leave it empty to hide the button.
tip_url = ""
# Linked in the page footer as "How this page is made".
repo_url = "https://github.com/tarasr-boop/citizens-park"
# An email address for the "Please share feedback" button in "How this works".
# Anyone can read it: on the page, and in this file. Leave it empty to hide the button.
# This one forwards to a private mailbox (Cloudflare Email Routing).
feedback_email = "feedback@citizensbark.com"

[about]
# The "About me" block on the page, under the week ahead.
# Leave text empty to hide the block.
heading = "About me"
text = "Hi, I'm Sofia, a dog trainer. I work at the Lost Dogs' Home shelter, run puppy school on the weekends and do private training."
# One link under the words, and the words to show for it.
link = "https://www.instagram.com/gentle_woof"
link_text = "@gentle_woof on Instagram"

[backend]
# The address of the alerts backend (the small Cloudflare program in the
# notifications/ folder). It runs the Telegram bot and counts visits for the
# stats page. Make it empty ("") and the page counts nothing.
url = "https://alerts.citizensbark.com"
